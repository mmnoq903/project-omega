[package]
name = "mrak"
version = "0.1.0"
description = "DARK REVENGE / MRAK :: Тёмный код мести — художественная офлайн-игра"
authors = ["PHANTOM"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
